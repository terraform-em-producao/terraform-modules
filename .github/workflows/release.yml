# Cria a tag <modulo>/vX.Y.Z a partir da main. Quem consome pina nessa tag.
name: release

on:
  workflow_dispatch:
    inputs:
      modulo:
        description: Nome do diretório em modules/
        required: true
      versao:
        description: "Versão semver, ex: 1.2.0"
        required: true

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: valida e cria a tag
        env:
          MODULO: ${{ inputs.modulo }}
          VERSAO: ${{ inputs.versao }}
        run: |
          [ -d "modules/$MODULO" ] || { echo "::error::modules/$MODULO não existe"; exit 1; }
          echo "$VERSAO" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::versão inválida"; exit 1; }
          tag="$MODULO/v$VERSAO"
          git rev-parse -q --verify "refs/tags/$tag" && { echo "::error::$tag já existe"; exit 1; }
          grep -q "^## $tag\$" CHANGELOG.md || { echo "::error::adicione '## $tag' no CHANGELOG.md antes"; exit 1; }
          git tag "$tag"
          git push origin "$tag"
          echo "Tag criada: \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
